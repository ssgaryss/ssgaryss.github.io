name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # main 分支更新就触发
  pull_request:
    branches:
      - main  # PR 合并到 main 也会触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # 你项目需要的 Node 版本

      - name: Install dependencies
        run: npm ci || npm install  # 如果没有 package-lock.json 可改成 npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
